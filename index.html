<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* 整体白底，完美居中 */
  body { 
    background: #ffffff; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
  }
  
  /* 输入框样式：圆角、蓝边、居中文字 */
  input { 
    padding: 15px; 
    border-radius: 12px; /* 圆角 */
    border: 2px solid #2563eb; /* 蓝色外边框 */
    background: #ffffff; 
    color: #333; 
    width: 220px; 
    outline: none; 
    text-align: center; /* 文字居中 */
    font-size: 24px; /* 数字大一点 */
    letter-spacing: 8px; /* 字间距，看起来更像密码框 */
    transition: all 0.3s ease;
  }

  /* 聚焦时加一点阴影，增加质感 */
  input:focus {
    box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
  }

  /* 验证中的提示文字 */
  #status {
    color: #2563eb;
    font-size: 14px;
    margin-top: 15px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    text-align: center;
  }
</style>
</head>
<body>

  <div style="display: flex; flex-direction: column; align-items: center;">
    <input 
      type="password" 
      id="pwd" 
      placeholder="• • • • • •" 
      maxlength="6" 
      autocomplete="off" 
      inputmode="numeric" 
      oninput="handleInput()"
    >
    <div id="status">验证中...</div>
  </div>

  <script>
    let isVerifying = false;

    function handleInput() {
      const pwdInput = document.getElementById('pwd');
      const pwd = pwdInput.value;
      
      // 如果正在验证中，或者输入长度不够 6 位，直接返回
      if (isVerifying || pwd.length !== 6) return;

      // 长度达到 6 位，自动触发验证
      verify(pwd);
    }

    async function verify(pwd) {
      isVerifying = true;
      const pwdInput = document.getElementById('pwd');
      const statusDiv = document.getElementById('status');
      
      pwdInput.disabled = true; // 锁定输入框
      statusDiv.style.opacity = '1'; // 显示“验证中”

      try {
        // 替换为你 Supabase 的 API 地址
        const response = await fetch('https://cztxlqewptdeajtpnpba.supabase.co/functions/v1/aichat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (response.ok) {
          // 密码正确，获取完整 HTML 并渲染
          const htmlText = await response.text();
          document.open();
          document.write(htmlText);
          document.close();
        } else {
          // 密码错误
          statusDiv.style.opacity = '0';
          alert('密码错误');
          pwdInput.value = '';
          pwdInput.disabled = false;
          isVerifying = false;
        }
      } catch (error) {
        statusDiv.style.opacity = '0';
        alert('网络异常，请稍后再试');
        pwdInput.value = '';
        pwdInput.disabled = false;
        isVerifying = false;
      }
    }
  </script>
</body>
</html>
