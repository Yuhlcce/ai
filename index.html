<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全验证</title>
<style>
  body { background: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
  .box { background: #1b1f27; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f1115; color: #fff; margin-top: 20px; width: 200px; outline: none; text-align: center; }
  button { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #555; cursor: wait; }
</style>
</head>
<body>
  <div class="box">
    <h2>🔒 安全验证</h2>
    <input type="password" id="pwd" placeholder="请输入密码">
    <button id="btn" onclick="verify()">进入</button>
  </div>

  <script>
    async function verify() {
      const pwd = document.getElementById('pwd').value;
      const btn = document.getElementById('btn');
      
      if(!pwd) return;

      btn.disabled = true;
      btn.innerText = '验证中...';

      try {
        // 👇 替换为你 Supabase 函数的 URL 👇
        const response = await fetch('https://cztxlqewptdeajtpnpba.supabase.co/functions/v1/aichat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (response.ok) {
          // 密码正确，获取解码后的完整 HTML
          const htmlText = await response.text();
          
          // 覆盖当前页面并渲染
          document.open();
          document.write(htmlText);
          document.close();
        } else {
          alert('密码错误，拒绝访问');
          btn.disabled = false;
          btn.innerText = '进入';
        }
      } catch (error) {
        alert('网络异常，请稍后再试');
        btn.disabled = false;
        btn.innerText = '进入';
      }
    }
  </script>
</body>
</html>
